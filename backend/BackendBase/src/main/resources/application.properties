spring.application.name=travel
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel}
spring.datasource.username=${DB_USER:travel}
spring.datasource.password=${DB_PASSWORD:secret}
spring.sql.init.encoding=UTF-8

# Hibernate owns the schema for now. schema.sql/data.sql are out of sync with
# the JPA entities (e.g. email_verified, travel_style columns that don't exist
# on User.java), so auto-running them would conflict. Disabled until reconciled
# or replaced with Flyway migrations.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:please-override-this-in-prod-please-override-this-in-prod}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jackson.date-format=dd-MM-yyyy
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health